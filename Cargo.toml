[package]
name = "pokergoat-solver"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "POKER GOAT wrapper CLI around the postflop-solver engine: job JSON in, solution blobs out"
repository = "https://github.com/chl89828/pokergoat-solver"
readme = "README.md"

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }
anyhow = "1"
brotli = "7"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
